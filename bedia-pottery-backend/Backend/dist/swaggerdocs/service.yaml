swagger: '3.0.0'
info:
  title: Service Model API
  description: API related to Service models
  version: 1.0.0

servers:
  - url: http://localhost:8000
    description: Local server
  - url: https://3lionsgroup.ae/
    description: Live server

paths:
  /service/all:
    get:
      summary: get all services
      description: Endpoint to get all services
      tags:
        - Service Model
      parameters:
        - name: page
          in: query
          description: page number for pagination
          required: false
          schema:
            type: number
            example: 1
        - name: limit
          in: query
          description: limit for pagination
          required: false
          schema:
            type: number
            example: 10
        - name: serviceTypeId
          in: query
          description: serviceTypeId
          required: false
          schema:
            type: string
            example: 34123123
      responses:
        200:
          description: Success response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Fetched services Successfully
                  result:
                    type: array
                    items:
                      type: object

  /service/adminAll:
    get:
      summary: get all services for admin
      description: Endpoint to get all services
      tags:
        - Service Model
      security:
        - JWT: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            example: award
        - name: page
          in: query
          required: false
          schema:
            type: number
            example: 1
        - name: limit
          in: query
          required: false
          schema:
            type: number
            example: 10
      responses:
        200:
          description: Success response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Fetched services Successfully
                  result:
                    type: array
                    items:
                      type: object

  /service:
    post:
      summary: Create service
      description: Endpoint to create service
      tags:
        - Service Model
      security:
        - JWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                image:
                  type: array
                  items:
                    type: string
                bannerImage:
                  type: string
                serviceTypeId:
                  type: string
                description:
                  type: string
                shortDescription:
                  type: string
                overview:
                  type: string
                keyAdvantages:
                  type: object
                  properties:
                    description:
                      type: string
                    items:
                      type: array
                      items:
                        type: object
                        properties:
                          title:
                            type: string
                          description:
                            type: string
                        required:
                          - title
                          - description
                  required:
                    - description
                    - items
              required:
                - title
                - image
                - description
                - shortDescription
                - overview
                - serviceTypeId
                - keyAdvantages
      responses:
        200:
          description: Success response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: Created service successfully
                  result:
                    type: boolean
                    example: true

  /service/{id}:
    get:
      summary: get service by id
      description: Endpoint to get a service detail by id
      tags:
        - Service Model
      security:
        - JWT: []
      parameters:
        - name: id
          in: path
          description: service Id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Success response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: Fetched service Successfully
                  result:
                    type: object

    put:
      summary: update service by id
      description: Endpoint to update service by id
      tags:
        - Service Model
      security:
        - JWT: []
      parameters:
        - name: id
          in: path
          description: service Id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                image:
                  type: array
                  items:
                    type: string
                bannerImage:
                  type: string
                description:
                  type: string
                shortDescription:
                  type: string
                overview:
                  type: string
                serviceTypeId:
                  type: string
                isActive:
                  type: boolean
                keyAdvantages:
                  type: object
                  properties:
                    description:
                      type: string
                    items:
                      type: array
                      items:
                        type: object
                        properties:
                          title:
                            type: string
                          description:
                            type: string
                        required:
                          - title
                          - description
                  required:
                    - description
                    - items
              required:
                - title
                - image
                - description
                - shortDescription
                - overview
                - serviceTypeId
                - keyAdvantages
      responses:
        200:
          description: Success response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: Updated service successfully
                  result:
                    type: boolean
                    example: true

    delete:
      summary: delete service by id
      description: Endpoint to delete a service by id
      tags:
        - Service Model
      security:
        - JWT: []
      parameters:
        - name: id
          in: path
          description: service Id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Success response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: Deleted service successfully
                  result:
                    type: boolean
                    example: true
